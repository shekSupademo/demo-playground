<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile · Settings</title>
  <link rel="stylesheet" href="../../assets/app.css">
</head>
<body data-page="profile" data-root="../../">
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">Acme Workspace</div>
      <ul class="nav" id="nav"></ul>
    </aside>
    <main class="main">
      <div class="page-header">
        <div>
          <h1>Profile</h1>
          <p>Manage how your name and email appear to people in your workspace.</p>
        </div>
      </div>

      <section class="card profile-card">
        <h2>Personal details</h2>
        <p class="muted" id="last-updated">Last updated 3 days ago</p>
        <form id="profile-form">
          <div class="field">
            <label for="full-name">Full name</label>
            <input type="text" id="full-name" name="fullName" placeholder="Jane Cooper">
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="jane@acme.com">
          </div>
          <button type="submit" class="btn btn-primary" id="save-profile">Save changes</button>
        </form>
      </section>
    </main>
  </div>
  <script src="../../assets/app.js"></script>
  <script>
    const profile = readList('profile', { fullName: '', email: '' });
    const form = document.getElementById('profile-form');
    form.fullName.value = profile.fullName;
    form.email.value = profile.email;
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      writeList('profile', { fullName: form.fullName.value, email: form.email.value });
      showToast('Profile saved');
    });
  </script>
</body>
</html>
