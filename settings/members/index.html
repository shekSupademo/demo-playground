<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Members · Settings</title>
  <link rel="stylesheet" href="../../assets/app.css">
</head>
<body data-page="members" data-root="../../">
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">Acme Workspace</div>
      <ul class="nav" id="nav"></ul>
    </aside>
    <main class="main">
      <div class="page-header">
        <div>
          <h1>Members</h1>
          <p>Invite teammates and manage who has access to this workspace.</p>
        </div>
        <div style="position: relative;">
          <button type="button" class="btn btn-secondary" id="more-actions" aria-label="More actions">⋯</button>
          <div id="more-menu" class="card" hidden style="position: absolute; right: 0; top: 40px; padding: 6px; min-width: 180px; z-index: 5;">
            <button type="button" class="btn btn-secondary" id="menu-invite" style="width: 100%; border: none;">Invite someone</button>
          </div>
        </div>
      </div>

      <section class="card">
        <h2>Workspace members</h2>
        <ul class="list" id="member-list"></ul>
      </section>
    </main>
  </div>

  <dialog id="invite-dialog">
    <form method="dialog" id="invite-form">
      <h2>Invite a member</h2>
      <div class="field">
        <label for="invite-email">Email address</label>
        <input type="email" id="invite-email" name="inviteEmail" placeholder="teammate@acme.com">
      </div>
      <div class="dialog-actions">
        <button type="button" class="btn btn-secondary" id="invite-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="send-invite">Send invite</button>
      </div>
    </form>
  </dialog>

  <script src="../../assets/app.js"></script>
  <script>
    const DEFAULT_MEMBERS = [
      { email: 'jane@acme.com', role: 'Owner' },
      { email: 'sam@acme.com', role: 'Member' },
    ];
    let members = readList('members', DEFAULT_MEMBERS);
    const dialog = document.getElementById('invite-dialog');

    function renderMembers() {
      document.getElementById('member-list').innerHTML = members
        .map((m) => `<li><span>${escapeHtml(m.email)}</span><span class="muted">${escapeHtml(m.role)}</span></li>`)
        .join('');
    }

    const menu = document.getElementById('more-menu');
    document.getElementById('more-actions').addEventListener('click', () => { menu.hidden = !menu.hidden; });
    document.getElementById('menu-invite').addEventListener('click', () => { menu.hidden = true; dialog.showModal(); });
    document.getElementById('invite-cancel').addEventListener('click', () => dialog.close());
    document.getElementById('invite-form').addEventListener('submit', (event) => {
      const email = event.target.inviteEmail.value.trim();
      if (!email) {
        event.preventDefault();
        return;
      }
      members = [...members, { email, role: 'Invited' }];
      writeList('members', members);
      renderMembers();
      event.target.reset();
      showToast(`Invite sent to ${email}`);
    });

    renderMembers();
  </script>
</body>
</html>
