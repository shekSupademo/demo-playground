<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Integrations</title>
<style>
  :root { --bg:#fff; --ink:#18181b; --muted:#71717a; --line:#e4e4e7; --soft:#f4f4f5; --accent:#059669; --accent-hover:#10b981; --ok-bg:#ecfdf5; --ok:#047857; color-scheme:light; }
  :root.dark { --bg:#18181b; --ink:#f4f4f5; --muted:#a1a1aa; --line:#27272a; --soft:#27272a; --ok-bg:#022c22; --ok:#6ee7b7; color-scheme:dark; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 24px; }
  li + li { border-top:1px solid var(--line); }
  .info { display:flex; align-items:center; gap:12px; min-width:0; }
  .logo { flex:none; display:inline-flex; width:36px; height:36px; border-radius:12px; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:13px; }
  .name { margin:0; font-weight:600; }
  .desc { margin:0; color:var(--muted); font-size:12px; }
  .side { flex:none; display:flex; align-items:center; gap:12px; }
  .status { font-size:12px; color:var(--muted); }
  .status.connected, .status.synced { display:inline-flex; padding:2px 8px; border-radius:999px; background:var(--ok-bg); color:var(--ok); font-weight:500; }
  button { font:inherit; font-size:12px; font-weight:500; height:32px; padding:0 14px; border-radius:10px; cursor:pointer; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  button:hover { background:var(--soft); }
  button.primary { border-color:var(--accent); background:var(--accent); color:#fff; }
  button.primary:hover { background:var(--accent-hover); }
  @media (max-width:480px) { li { flex-direction:column; align-items:flex-start; } }
</style>
<script>
  if (new URLSearchParams(location.search).get("theme") === "dark") document.documentElement.classList.add("dark");
</script>
</head>
<body>
<ul id="integrations" data-testid="integration-list"></ul>
<script>
  // One row per entry, top to bottom. Add, remove or reorder rows here.
  const INTEGRATIONS = [
    { id: "quickbooks", name: "QuickBooks", description: "Sync transactions and categories to your books.", logo: "QB", color: "#2ca01c" },
    { id: "slack", name: "Slack", description: "Post payment and card alerts to a channel.", logo: "S", color: "#611f69" },
    { id: "gusto", name: "Gusto", description: "Fund payroll runs from your Payroll account.", logo: "G", color: "#f45d48" },
  ];

  // State lives only in this page, so every visit starts disconnected.
  const state = Object.fromEntries(INTEGRATIONS.map((i) => [i.id, "disconnected"]));
  const STATUS = { disconnected: "Not connected", connected: "Connected", synced: "Synced just now" };

  const list = document.getElementById("integrations");

  function render() {
    list.replaceChildren(...INTEGRATIONS.map(row));
  }

  function row(item) {
    const s = state[item.id];
    const li = document.createElement("li");
    li.dataset.testid = `integration-${item.id}`;
    li.innerHTML = `
      <div class="info">
        <span class="logo" aria-hidden="true" style="background:${item.color}">${item.logo}</span>
        <div>
          <p class="name">${item.name}</p>
          <p class="desc">${item.description}</p>
        </div>
      </div>
      <div class="side">
        <span class="status ${s}" data-testid="status-${item.id}">${STATUS[s]}</span>
      </div>`;
    const button = document.createElement("button");
    button.type = "button";
    if (s === "disconnected") {
      button.textContent = "Connect";
      button.className = "primary";
      button.dataset.testid = `connect-${item.id}`;
      button.addEventListener("click", () => set(item.id, "connected"));
    } else {
      button.textContent = "Sync now";
      button.dataset.testid = `sync-${item.id}`;
      button.addEventListener("click", () => set(item.id, "synced"));
    }
    li.querySelector(".side").append(button);
    return li;
  }

  function set(id, next) {
    state[id] = next;
    render();
  }

  render();
</script>
</body>
</html>
