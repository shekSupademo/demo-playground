<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Integrations wrapper</title>
<style>
  html, body { margin:0; background:transparent; }
  iframe { display:block; width:100%; height:200px; border:0; }
</style>
</head>
<body>
<!-- A second, same-origin frame: Settings embeds this page, and this page embeds the rows page. -->
<iframe id="inner" title="Integration list" name="integrations-list" data-testid="integrations-inner-frame"></iframe>
<script>
  const inner = document.getElementById("inner");
  // Pass the theme (?theme=dark) through to the rows page.
  inner.src = `./index.html${location.search}`;
  // Same origin, so the inner document can be measured to fit its content.
  inner.addEventListener("load", () => {
    const body = inner.contentDocument.body;
    const measure = () => { inner.style.height = `${Math.ceil(body.getBoundingClientRect().height)}px`; };
    measure();
    new ResizeObserver(measure).observe(body);
  });
</script>
</body>
</html>
